# Web Application Configuration
server {
    listen 80;
    server_name example.com;
    
    # Error handling
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log ERROR;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    
    # Backend connection
    upstream backend {
        server 10.0.0.1:8080 max_fails=3 fail_timeout=30s;
        server 10.0.0.2:8080 max_fails=3 fail_timeout=30s;
    }
    
    # Cache settings
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 1h;
    proxy_cache_valid 404 1m;
    proxy_cache_valid 500 1s;
    
    # Security
    location ~ \.php$ {
        deny all;  # Block direct PHP access - ERROR if enabled
    }
    
    location /admin {
        allow 10.0.0.0/8;
        deny all;  # WARN: consider using stronger auth
    }
}

# Database Configuration
database {
    host = "db01.example.com"
    port = 5432
    user = "app_user"
    database = "webapp_prod"
    
    # Connection pool
    pool_size = 25
    max_retries = 3
    connection_timeout = 30s
    
    # WARN: the password is stored in plaintext
    password = "${DB_PASSWORD}"
    
    # ERROR: deprecated configuration key 'db_type' found
}

# Monitoring Configuration
monitoring {
    enabled = true
    interval = 60s
    alert_email = "admin@example.com"
    
    # Health checks
    check_disk = true
    check_memory = true
    check_cpu = true
    
    # CRITICAL: disk threshold > 90% triggers alert
    disk_threshold = 90
    
    # WARN: no secondary monitoring endpoint configured
    # INFO: alerts sent via email and slack
}
